<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Планировщик дня</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1018;--card:#151929;--card2:#1a1f30;--border:#232840;
  --accent:#4f8ef7;--red:#e24b4a;--amber:#ef9f27;--green:#1db87e;--purple:#8b7fe8;
  --text:#ebedf5;--muted:#6b7490;--line:#242b42;--line-half:#181d2e;
  --shadow:0 8px 32px rgba(0,0,0,.55);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── layout ─────────────────────────────────────────── */
.app{padding:16px;max-width:820px;margin:0 auto}

/* ── topbar ──────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:-.2px}
.live-clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--card);border:0.5px solid var(--border);border-radius:6px;padding:3px 8px}
.actions{display:flex;gap:6px}
.btn{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 14px;font-size:12px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.btn:hover{background:var(--card2);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn-primary:hover{background:#3a7ae8;border-color:#3a7ae8}
.btn-danger{border-color:transparent;color:var(--muted)}
.btn-danger:hover{border-color:var(--red);color:var(--red);background:#1a0c0c}

/* ── day nav ─────────────────────────────────────────── */
.nav-days{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px}
.day-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:6px 13px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.day-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.day-btn.has-tasks{border-color:#355fa8;color:var(--text)}
.day-btn:hover:not(.active){background:var(--card2);color:var(--text);border-color:#3a4260}

/* ── stats ───────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;transition:border-color .2s}
.stat:hover{border-color:#3a4260}
.stat-l{font-size:11px;color:var(--muted);margin-bottom:3px}
.stat-v{font-size:22px;font-weight:600;letter-spacing:-.5px}
.stat-v.blue{color:var(--accent)}.stat-v.green{color:var(--green)}.stat-v.amber{color:var(--amber)}

/* ── date header ─────────────────────────────────────── */
.date-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;flex-wrap:wrap;gap:8px}
.date-label{font-size:14px;font-weight:600}
.prog-wrap{display:flex;align-items:center;gap:9px}
.progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;width:110px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#2dcf96);border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog-txt{font-size:12px;color:var(--muted);min-width:32px;text-align:right}

/* ── timeline ────────────────────────────────────────── */
.timeline{position:relative;padding-left:60px}
.slot-row{display:flex;position:relative;min-height:38px}
.slot-row.hour-start{border-left:1.5px solid var(--line)}
.slot-row.half-start{border-left:1px dashed var(--line-half)}
.slot-label{position:absolute;left:-60px;width:52px;text-align:right;padding-right:10px;font-size:11px;font-variant-numeric:tabular-nums;top:-8px}
.slot-label.hour-lbl{color:var(--text);font-weight:600}
.slot-label.half-lbl{color:var(--muted)}
.slot-dot{position:absolute;left:-5px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.slot-row.now-slot .slot-dot{background:var(--accent);border-color:var(--bg);box-shadow:0 0 0 3px rgba(79,142,247,.25)}
.slot-content{flex:1;padding:3px 0 3px 14px;min-height:38px;cursor:pointer;border-radius:0 8px 8px 0;transition:background .12s}
.slot-content:hover{background:rgba(79,142,247,.07)}
.slot-content:hover .empty-hint{color:#3a4570}

/* ── task block ──────────────────────────────────────── */
.task-block{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin-bottom:4px;display:flex;align-items:flex-start;gap:9px;transition:border-color .15s,opacity .25s,transform .2s;animation:taskIn .2s ease}
@keyframes taskIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.task-block:hover{border-color:#3a4870}
.task-block.done-block{opacity:.4}
.task-block.cat-ops  {border-left:2.5px solid var(--accent);border-radius:0 9px 9px 0}
.task-block.cat-meet {border-left:2.5px solid var(--purple);border-radius:0 9px 9px 0}
.task-block.cat-report{border-left:2.5px solid var(--amber);border-radius:0 9px 9px 0}
.task-block.cat-urgent{border-left:2.5px solid var(--red);border-radius:0 9px 9px 0}

/* custom checkbox */
.task-check-wrap{margin-top:1px;flex-shrink:0}
.task-check{display:none}
.task-check-box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,border-color .15s}
.task-check-box:hover{border-color:var(--accent)}
.task-check:checked+.task-check-box{background:var(--accent);border-color:var(--accent)}
.task-check:checked+.task-check-box::after{content:'';display:block;width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0px,-1px)}

.task-text{flex:1;min-width:0}
.task-title{font-size:13px;font-weight:500;line-height:1.4;word-break:break-word;transition:color .2s}
.task-title.done-text{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:5px;margin-top:4px;align-items:center;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:.2px}
.tag-ops   {background:#0a1a35;color:#5a9aff;border:1px solid #1e3d6e}
.tag-meet  {background:#160f2e;color:#b0aaff;border:1px solid #3d2f7a}
.tag-report{background:#261a06;color:#f5ab3a;border:1px solid #6b4710}
.tag-urgent{background:#280d0d;color:#f05555;border:1px solid #6e1f1f}
.tag-done  {background:#082016;color:#2ecc8e;border:1px solid #0d5c39}
.task-dur{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.task-note{font-size:11px;color:#3e4762;font-style:italic}
.task-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex-shrink:0;margin-top:1px}
.task-block:hover .task-actions{opacity:1}
.icon-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:14px;display:inline-flex;align-items:center;transition:color .15s,background .15s}
.icon-btn:hover{color:var(--text);background:var(--border)}
.icon-btn.del-btn:hover{color:var(--red);background:#1a0c0c}

/* ── now line ────────────────────────────────────────── */
.now-line{position:absolute;left:-8px;right:0;height:1.5px;background:var(--accent);z-index:10;pointer-events:none}
.now-dot{position:absolute;left:-12px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.3)}

.empty-hint{font-size:11px;color:#1f2840;pointer-events:none;padding:5px 0;transition:color .15s;display:flex;align-items:center;gap:4px}
.empty-hint::before{content:'+';font-size:14px;opacity:.6}

/* ── modal ───────────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px 40px;z-index:100;overflow-y:auto;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%;max-width:420px;margin-bottom:40px;box-shadow:var(--shadow);transform:translateY(-12px) scale(.98);transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .2s;opacity:0}
.modal-bg.open .modal{transform:translateY(0) scale(1);opacity:1}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal h2{font-size:15px;font-weight:600}
.modal-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px;display:inline-flex;border-radius:6px;transition:color .15s,background .15s}
.modal-close:hover{color:var(--text);background:var(--border)}

.fg{margin-bottom:11px}
.fg label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.fg input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
.fg input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* time selects */
.time-sel{display:flex;gap:6px;align-items:center}
.time-sel select{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;font-family:inherit;cursor:pointer}
.time-sel select:focus{border-color:var(--accent)}
.time-sel select option{background:var(--card)}
.time-sep{color:var(--muted);font-size:14px}

/* category buttons */
.cat-btns{display:flex;gap:6px;flex-wrap:wrap}
.cat-btn{flex:1;min-width:80px;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 8px;font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;letter-spacing:.2px}
.cat-btn:hover{background:var(--card2)}
.cat-btn.active-ops   {background:#0a1a35;color:#5a9aff;border-color:#1e3d6e}
.cat-btn.active-meet  {background:#160f2e;color:#b0aaff;border-color:#3d2f7a}
.cat-btn.active-report{background:#261a06;color:#f5ab3a;border-color:#6b4710}
.cat-btn.active-urgent{background:#280d0d;color:#f05555;border-color:#6e1f1f}

.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* ── toast ───────────────────────────────────────────── */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);animation:toastIn .25s cubic-bezier(.34,1.56,.64,1);pointer-events:all}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
.toast.ok{border-color:#0d5c39;color:var(--green)}
.toast.err{border-color:#6e1f1f;color:var(--red)}

/* ── confirm overlay ─────────────────────────────────── */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:150;opacity:0;transition:opacity .15s;pointer-events:none}
.confirm-bg.open{opacity:1;pointer-events:all}
.confirm-box{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:20px 22px;max-width:310px;width:90%;box-shadow:var(--shadow);transform:scale(.96);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.confirm-bg.open .confirm-box{transform:scale(1)}
.confirm-msg{font-size:14px;font-weight:500;margin-bottom:14px;line-height:1.5}
.confirm-btns{display:flex;gap:8px;justify-content:flex-end}

/* ── responsive ──────────────────────────────────────── */
@media(max-width:520px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .task-title{font-size:12px}
  .slot-label{font-size:10px;left:-54px;width:46px}
  .timeline{padding-left:54px}
  .date-label{font-size:13px}
  .cat-btn{min-width:60px;font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <h1><i class="ti ti-layout-kanban" style="color:#4f8ef7;font-size:18px"></i> Планировщик</h1>
      <span class="live-clock" id="live-clock"></span>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="openAdd(null)"><i class="ti ti-plus"></i> Задача</button>
      <button class="btn btn-danger" onclick="askReset()" title="Сбросить все данные"><i class="ti ti-trash"></i></button>
    </div>
  </div>
  <div class="nav-days" id="nav-days"></div>
  <div class="stats-row" id="stats"></div>
  <div class="date-header">
    <div class="date-label" id="date-label"></div>
    <div class="prog-wrap">
      <span class="prog-txt" id="prog-txt"></span>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
  </div>
  <div class="timeline" id="timeline"></div>
</div>

<!-- Add/Edit modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Новая задача</h2>
      <button class="modal-close" onclick="closeModal()" title="Закрыть (Esc)"><i class="ti ti-x"></i></button>
    </div>
    <div class="fg"><label>Название</label><input id="f-name" type="text" placeholder="Что нужно сделать…" autocomplete="off"></div>
    <div class="row2">
      <div class="fg"><label>Дата</label><input id="f-date" type="date"></div>
      <div class="fg"><label>Время</label>
        <div class="time-sel">
          <select id="f-start"></select>
          <span class="time-sep">–</span>
          <select id="f-end"></select>
        </div>
      </div>
    </div>
    <div class="fg"><label>Категория</label>
      <div class="cat-btns">
        <button class="cat-btn" data-cat="ops"    onclick="pickCat('ops')"   >Операционная</button>
        <button class="cat-btn" data-cat="meet"   onclick="pickCat('meet')"  >Встреча</button>
        <button class="cat-btn" data-cat="report" onclick="pickCat('report')">Отчётность</button>
        <button class="cat-btn" data-cat="urgent" onclick="pickCat('urgent')">Срочная</button>
      </div>
    </div>
    <div class="fg"><label>Комментарий</label><input id="f-note" type="text" placeholder="Детали, ссылки…" autocomplete="off"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveTask()"><i class="ti ti-check"></i> Сохранить</button>
    </div>
  </div>
</div>

<!-- Confirm dialog -->
<div class="confirm-bg" id="confirm-bg">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button class="btn" onclick="confirmResolve(false)">Отмена</button>
      <button class="btn btn-danger" id="confirm-ok" onclick="confirmResolve(true)">Удалить</button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
const KEY='planner_30m_v2';
let tasks=[],selDate='',editId=null,selCat='ops';
const DAYS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const CAT={
  ops:   {label:'Операционная',tag:'tag-ops'},
  meet:  {label:'Встреча',     tag:'tag-meet'},
  report:{label:'Отчётность',  tag:'tag-report'},
  urgent:{label:'Срочная',     tag:'tag-urgent'},
};

// ── utils ────────────────────────────────────────────────
function p2(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function fmtFull(s){const d=new Date(s+'T00:00:00');return`${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`}
function toMins(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function durText(s,e){const d=toMins(e)-toMins(s);if(d<=0)return'';if(d<60)return d+' мин';const h=Math.floor(d/60),m=d%60;return h+'ч'+(m?' '+m+' мин':'')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function allSlots(){const s=[];for(let h=8;h<=20;h++){s.push({h,m:0,key:`${p2(h)}:00`});if(h<20)s.push({h,m:30,key:`${p2(h)}:30`})}return s}
function slotOptions(){const s=[];for(let h=8;h<=20;h++){s.push(`${p2(h)}:00`);if(h<20)s.push(`${p2(h)}:30`)}s.push('20:00');return s}

// ── toast ────────────────────────────────────────────────
function toast(msg,type='ok'){
  const w=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<i class="ti ti-${type==='ok'?'check':'alert-circle'}"></i>${msg}`;
  w.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},2200);
}

// ── confirm ──────────────────────────────────────────────
let _confirmRes=null;
function showConfirm(msg,okLabel='Удалить'){
  return new Promise(res=>{
    _confirmRes=res;
    document.getElementById('confirm-msg').textContent=msg;
    document.getElementById('confirm-ok').textContent=okLabel;
    document.getElementById('confirm-bg').classList.add('open');
  });
}
function confirmResolve(v){
  document.getElementById('confirm-bg').classList.remove('open');
  if(_confirmRes){_confirmRes(v);_confirmRes=null;}
}

// ── storage ──────────────────────────────────────────────
function load(){
  const raw=localStorage.getItem(KEY);
  if(raw){const p=JSON.parse(raw);tasks=p.tasks||[];selDate=p.selDate||todayStr();}
  else{
    selDate=todayStr();
    const td=selDate;
    tasks=[
      {id:1, name:'Утренний брифинг с командой',               date:td,              start:'09:00',end:'09:30',cat:'meet',  done:false,note:'Обсудить план на день'},
      {id:2, name:'Проверка входящих и расстановка приоритетов',date:td,              start:'09:30',end:'10:00',cat:'ops',   done:false,note:''},
      {id:3, name:'Анализ KPI-отчёта за прошлую неделю',        date:td,              start:'10:00',end:'11:00',cat:'report',done:false,note:'Сводная таблица'},
      {id:4, name:'Звонок с поставщиком',                       date:td,              start:'11:00',end:'11:30',cat:'urgent',done:false,note:'Контракт №45-2025'},
      {id:5, name:'Обед / пауза',                               date:td,              start:'12:30',end:'13:00',cat:'ops',   done:false,note:''},
      {id:6, name:'Согласование бюджета с финотделом',          date:td,              start:'13:00',end:'14:00',cat:'ops',   done:false,note:'Конференц-зал №2'},
      {id:7, name:'Подготовка презентации для директора',       date:td,              start:'14:30',end:'16:30',cat:'report',done:false,note:''},
      {id:8, name:'Ревизия складских остатков — Склад А',       date:addDays(td,1),   start:'10:00',end:'11:30',cat:'ops',   done:false,note:''},
      {id:9, name:'Встреча с новым подрядчиком',                date:addDays(td,1),   start:'14:00',end:'14:30',cat:'meet',  done:false,note:''},
      {id:10,name:'Квартальный отчёт',                          date:addDays(td,-1),  start:'09:00',end:'11:00',cat:'report',done:true, note:'Отправлен'},
    ];
    save();
  }
}
function save(){localStorage.setItem(KEY,JSON.stringify({tasks,selDate}))}
function getDates(){
  const t=todayStr();
  const all=new Set(tasks.map(x=>x.date));
  [-2,-1,0,1,2,3].forEach(n=>all.add(addDays(t,n)));
  return[...all].sort();
}

// ── render ───────────────────────────────────────────────
function renderNav(){
  const t=todayStr();
  document.getElementById('nav-days').innerHTML=getDates().map(d=>{
    const dt=new Date(d+'T00:00:00');
    const lbl=d===t?'Сегодня':d===addDays(t,-1)?'Вчера':d===addDays(t,1)?'Завтра':`${DAYS[dt.getDay()]} ${dt.getDate()}`;
    const has=tasks.some(x=>x.date===d);
    return`<button class="day-btn${d===selDate?' active':''}${has&&d!==selDate?' has-tasks':''}" onclick="selDay('${d}')">${lbl}</button>`;
  }).join('');
}
function selDay(d){selDate=d;save();render()}

function renderStats(){
  const dt=tasks.filter(x=>x.date===selDate);
  const done=dt.filter(x=>x.done).length,total=dt.length;
  const urg=dt.filter(x=>x.cat==='urgent'&&!x.done).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-l">Всего задач</div><div class="stat-v blue">${total}</div></div>
    <div class="stat"><div class="stat-l">Выполнено</div><div class="stat-v green">${done}</div></div>
    <div class="stat"><div class="stat-l">Срочных</div><div class="stat-v amber">${urg}</div></div>
    <div class="stat"><div class="stat-l">Прогресс</div><div class="stat-v">${pct}%</div></div>`;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=`${done}/${total}`;
}

function renderDateHeader(){
  const t=todayStr();
  const pre=selDate===t?'Сегодня — ':selDate===addDays(t,1)?'Завтра — ':selDate===addDays(t,-1)?'Вчера — ':'';
  document.getElementById('date-label').textContent=pre+fmtFull(selDate);
}

function renderTimeline(){
  const isToday=selDate===todayStr();
  const now=new Date();
  const nowMins=now.getHours()*60+now.getMinutes();
  const dayTasks=tasks.filter(x=>x.date===selDate);
  const slots=allSlots();
  let html='';
  slots.forEach(({h,m,key})=>{
    const isHour=m===0;
    const slotMins=h*60+m;
    const nextMins=slotMins+30;
    const isNow=isToday&&nowMins>=slotMins&&nowMins<nextMins;
    const st=dayTasks.filter(t=>{const sm=toMins(t.start);return sm>=slotMins&&sm<nextMins})
                      .sort((a,b)=>a.start.localeCompare(b.start));
    html+=`<div class="slot-row${isHour?' hour-start':' half-start'}${isNow?' now-slot':''}">`;
    html+=`<span class="slot-label ${isHour?'hour-lbl':'half-lbl'}">${key}</span>`;
    if(isHour)html+=`<div class="slot-dot"></div>`;
    if(isNow){
      const pct=Math.round(((nowMins-slotMins)/30)*100);
      html+=`<div class="now-line" style="top:${pct}%"><div class="now-dot"></div></div>`;
    }
    html+=`<div class="slot-content" onclick="openAdd('${key}')" title="Добавить задачу на ${key}">`;
    if(!st.length)html+=`<div class="empty-hint">${key}</div>`;
    st.forEach(t=>{
      const dur=durText(t.start,t.end);
      html+=`<div class="task-block cat-${t.cat}${t.done?' done-block':''}">
        <div class="task-check-wrap" onclick="event.stopPropagation()">
          <input type="checkbox" class="task-check" id="chk${t.id}" ${t.done?'checked':''} onchange="toggle(${t.id})">
          <label class="task-check-box" for="chk${t.id}"></label>
        </div>
        <div class="task-text">
          <div class="task-title${t.done?' done-text':''}">${esc(t.name)}</div>
          <div class="task-meta">
            <span class="tag ${CAT[t.cat].tag}">${CAT[t.cat].label}</span>
            <span class="task-dur"><i class="ti ti-clock" style="font-size:10px"></i> ${t.start}–${t.end}${dur?' · '+dur:''}</span>
            ${t.done?'<span class="tag tag-done">✓ Готово</span>':''}
            ${t.note?`<span class="task-note">${esc(t.note)}</span>`:''}
          </div>
        </div>
        <div class="task-actions">
          <button class="icon-btn" onclick="openEdit(${t.id});event.stopPropagation()" title="Редактировать"><i class="ti ti-edit"></i></button>
          <button class="icon-btn del-btn" onclick="askDel(${t.id});event.stopPropagation()" title="Удалить"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById('timeline').innerHTML=html;
  if(isToday){
    const el=document.querySelector('.now-slot');
    if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),150);
  }
}

// ── live clock ───────────────────────────────────────────
function tickClock(){
  const n=new Date();
  document.getElementById('live-clock').textContent=`${p2(n.getHours())}:${p2(n.getMinutes())}`;
}
tickClock();
setInterval(tickClock,10000);

// ── modal ────────────────────────────────────────────────
function populateTimes(sv,ev){
  const opts=slotOptions();
  ['f-start','f-end'].forEach((id,i)=>{
    const val=i===0?sv:ev;
    document.getElementById(id).innerHTML=opts.map(o=>`<option value="${o}"${o===val?' selected':''}>${o}</option>`).join('');
  });
}
function pickCat(c){
  selCat=c;
  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.className='cat-btn'+(b.dataset.cat===c?' active-'+c:'');
  });
}
function openAdd(slotKey){
  editId=null;
  document.getElementById('modal-title').textContent='Новая задача';
  document.getElementById('f-name').value='';
  document.getElementById('f-date').value=selDate;
  document.getElementById('f-note').value='';
  const s=slotKey||'09:00';
  const[sh,sm]=s.split(':').map(Number);
  const em=(sh*60+sm)+30;
  populateTimes(s,`${p2(Math.floor(em/60))}:${p2(em%60)}`);
  pickCat('ops');
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),80);
}
function openEdit(id){
  editId=id;
  const t=tasks.find(x=>x.id===id);
  document.getElementById('modal-title').textContent='Редактировать задачу';
  document.getElementById('f-name').value=t.name;
  document.getElementById('f-date').value=t.date;
  document.getElementById('f-note').value=t.note||'';
  populateTimes(t.start,t.end);
  pickCat(t.cat);
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),80);
}
function closeModal(){document.getElementById('modal').classList.remove('open')}

function saveTask(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){
    document.getElementById('f-name').focus();
    document.getElementById('f-name').style.borderColor='var(--red)';
    setTimeout(()=>document.getElementById('f-name').style.borderColor='',1200);
    return;
  }
  const obj={
    name,
    date:document.getElementById('f-date').value||selDate,
    cat:selCat,
    start:document.getElementById('f-start').value,
    end:document.getElementById('f-end').value,
    note:document.getElementById('f-note').value.trim(),
    done:false,
  };
  if(editId){
    const prev=tasks.find(x=>x.id===editId);
    obj.done=prev.done;
    Object.assign(prev,obj);
    toast('Задача обновлена');
  } else {
    tasks.push({id:Date.now(),...obj});
    toast('Задача добавлена');
  }
  save();closeModal();render();
}

// ── task actions ─────────────────────────────────────────
function toggle(id){
  const t=tasks.find(x=>x.id===id);
  if(t){
    t.done=!t.done;
    save();
    renderStats();
    // re-render only timeline to keep animation
    renderTimeline();
    if(t.done)toast('Отмечено выполненным ✓');
  }
}
async function askDel(id){
  const t=tasks.find(x=>x.id===id);
  const ok=await showConfirm(`Удалить «${t.name}»?`);
  if(ok){tasks=tasks.filter(x=>x.id!==id);save();render();toast('Задача удалена','err')}
}
async function askReset(){
  const ok=await showConfirm('Сбросить все данные и начать заново?','Сбросить');
  if(ok){localStorage.removeItem(KEY);load();render();toast('Данные сброшены','err')}
}

// ── keyboard ─────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('confirm-bg').classList.contains('open'))confirmResolve(false);
    else closeModal();
  }
  if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open')&&
     document.activeElement!==document.getElementById('f-note')){
    e.preventDefault();saveTask();
  }
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.getElementById('confirm-bg').addEventListener('click',e=>{if(e.target===e.currentTarget)confirmResolve(false)});

// ── init ─────────────────────────────────────────────────
function render(){renderNav();renderStats();renderDateHeader();renderTimeline()}
load();render();
setInterval(()=>{if(selDate===todayStr())renderTimeline()},30000);
</script>
</body>
</html>
