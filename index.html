<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер задач — Операционный менеджмент</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222535;
    --border: #2e3247;
    --accent: #5b6af0;
    --accent-hover: #7080ff;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --orange: #f97316;
    --text: #e8eaf6;
    --muted: #8b90a7;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .header-left h1 {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header-left p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .header-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* BUTTONS */
  .btn {
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-danger { background: #3a1a1a; color: var(--red); border: 1px solid #5a2020; }
  .btn-danger:hover { background: #4a2020; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  /* STATS BAR */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-card .stat-num {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-card .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .stat-total .stat-num { color: var(--accent); }
  .stat-done .stat-num { color: var(--green); }
  .stat-urgent .stat-num { color: var(--red); }
  .stat-inprog .stat-num { color: var(--yellow); }

  /* NOTIFICATION BANNER */
  .notif-banner {
    background: linear-gradient(135deg, #3a2800, #2a1500);
    border: 1px solid var(--orange);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
    display: none;
  }
  .notif-banner.show { display: block; }
  .notif-banner h3 { font-size: 14px; color: var(--orange); margin-bottom: 6px; }
  .notif-item { font-size: 13px; color: #ffd0a0; margin: 3px 0; }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-bar input[type="text"] {
    flex: 1;
    min-width: 160px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .filter-bar input[type="text"]:focus { border-color: var(--accent); }
  .filter-btn {
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

  /* TASK LIST */
  .tasks-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .tasks-header h2 { font-size: 16px; font-weight: 600; color: var(--muted); }

  .task-list { display: flex; flex-direction: column; gap: 10px; }

  /* TASK CARD */
  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: start;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .task-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    border-radius: 4px 0 0 4px;
  }
  .task-card.urgent::before { background: var(--red); }
  .task-card.warning::before { background: var(--orange); }
  .task-card.normal::before { background: var(--accent); }
  .task-card.done-card::before { background: var(--green); }
  .task-card.overdue::before { background: #7f0000; }

  .task-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)22; }
  .task-card.done-card { opacity: 0.6; }

  /* CHECKBOX */
  .task-checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    margin-top: 2px;
  }
  .task-checkbox.checked { background: var(--green); border-color: var(--green); }
  .task-checkbox.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }
  .task-checkbox:hover { border-color: var(--green); }

  /* TASK BODY */
  .task-body { min-width: 0; }
  .task-name {
    font-size: 16px;
    font-weight: 600;
    word-break: break-word;
    line-height: 1.3;
  }
  .task-card.done-card .task-name { text-decoration: line-through; color: var(--muted); }
  .task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    align-items: center;
  }
  .badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-status-todo { background: #1e2040; color: #9ba3ff; }
  .badge-status-in_progress { background: #2a1f00; color: var(--yellow); }
  .badge-status-review { background: #1a1040; color: #c084fc; }
  .badge-status-done { background: #0a2a10; color: var(--green); }

  .days-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .days-overdue { background: #3a0000; color: #ff8080; }
  .days-urgent { background: #3a1000; color: #ff9060; }
  .days-warning { background: #2a2000; color: #ffd060; }
  .days-ok { background: #0e2210; color: #60d090; }
  .days-done { background: #111; color: var(--muted); }

  .deadline-text { font-size: 12px; color: var(--muted); }

  /* TASK ACTIONS */
  .task-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
    display: none;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 20px; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }
  .form-group select option { background: var(--surface2); }
  .form-group textarea { resize: vertical; min-height: 80px; }

  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* CONFIRM MODAL */
  .confirm-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .confirm-modal h3 { font-size: 17px; margin-bottom: 10px; }
  .confirm-modal p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }

  /* TOAST */
  .toast-container {
    position: fixed;
    bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 200;
  }
  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 14px;
    max-width: 320px;
    animation: slideIn 0.2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  .toast.warning { border-color: var(--orange); }
  @keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* PROGRESS BAR */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar-bg {
    background: var(--surface2);
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* RESPONSIVE */
  @media (max-width: 500px) {
    .task-card {
      grid-template-columns: auto 1fr;
    }
    .task-actions {
      grid-column: 2;
      grid-row: 2;
    }
    .header-actions { width: 100%; }
    .header-actions .btn { flex: 1; text-align: center; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <h1>📋 Трекер задач</h1>
    <p>Операционный менеджмент · <span id="today-date"></span></p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openModal()">+ Новая задача</button>
    <button class="btn btn-ghost" onclick="requestNotifPermission()">🔔 Уведомления</button>
    <button class="btn btn-danger" onclick="showResetConfirm()">Сбросить данные</button>
  </div>
</div>

<!-- NOTIFICATION BANNER -->
<div class="notif-banner" id="notifBanner">
  <h3>⚠️ Срочные напоминания</h3>
  <div id="notifList"></div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat-card stat-total">
    <div class="stat-num" id="stat-total">0</div>
    <div class="stat-label">Всего задач</div>
  </div>
  <div class="stat-card stat-inprog">
    <div class="stat-num" id="stat-inprog">0</div>
    <div class="stat-label">В работе</div>
  </div>
  <div class="stat-card stat-urgent">
    <div class="stat-num" id="stat-urgent">0</div>
    <div class="stat-label">Срочных (≤2 дня)</div>
  </div>
  <div class="stat-card stat-done">
    <div class="stat-num" id="stat-done">0</div>
    <div class="stat-label">Выполнено</div>
  </div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-label">
    <span>Прогресс выполнения</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <input type="text" id="searchInput" placeholder="🔍 Поиск по названию..." oninput="renderTasks()">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">Все</button>
  <button class="filter-btn" data-filter="todo" onclick="setFilter('todo',this)">К выполнению</button>
  <button class="filter-btn" data-filter="in_progress" onclick="setFilter('in_progress',this)">В работе</button>
  <button class="filter-btn" data-filter="review" onclick="setFilter('review',this)">На проверке</button>
  <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">Готово</button>
</div>

<!-- TASK LIST -->
<div class="tasks-header">
  <h2 id="tasks-count-label">Задачи</h2>
</div>
<div class="task-list" id="taskList"></div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2 id="modalTitle">Новая задача</h2>
    <div class="form-group">
      <label>Название задачи *</label>
      <input type="text" id="f-name" placeholder="Например: Подготовить отчёт по KPI">
    </div>
    <div class="form-group">
      <label>Описание</label>
      <textarea id="f-desc" placeholder="Дополнительные детали..."></textarea>
    </div>
    <div class="form-group">
      <label>Дедлайн *</label>
      <input type="date" id="f-deadline">
    </div>
    <div class="form-group">
      <label>Статус</label>
      <select id="f-status">
        <option value="todo">К выполнению</option>
        <option value="in_progress">В работе</option>
        <option value="review">На проверке</option>
        <option value="done">Готово</option>
      </select>
    </div>
    <div class="form-group">
      <label>Приоритет</label>
      <select id="f-priority">
        <option value="high">🔴 Высокий</option>
        <option value="medium">🟡 Средний</option>
        <option value="low">🟢 Низкий</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveTask()">Сохранить</button>
    </div>
  </div>
</div>

<!-- CONFIRM RESET MODAL -->
<div class="modal-overlay" id="confirmModal">
  <div class="confirm-modal">
    <h3>Сбросить все данные?</h3>
    <p>Все задачи будут удалены безвозвратно. Это действие нельзя отменить.</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-ghost" onclick="closeConfirm()">Отмена</button>
      <button class="btn btn-danger" onclick="resetAll()">Удалить всё</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let tasks = [];
let editingId = null;
let currentFilter = 'all';
const USER_EMAIL = 'vibe14@sba.kz';

const STATUSES = {
  todo: 'К выполнению',
  in_progress: 'В работе',
  review: 'На проверке',
  done: 'Готово'
};

const PRIORITIES = {
  high: 'Высокий',
  medium: 'Средний',
  low: 'Низкий'
};

// ─── SEED DATA ────────────────────────────────────────────────────────────────
const SEED = [
  {
    id: 's1',
    name: 'Подготовить квартальный отчёт по KPI',
    desc: 'Собрать данные из всех отделов, сформировать сводную таблицу и презентацию для совета директоров.',
    deadline: offsetDate(1),
    status: 'in_progress',
    priority: 'high',
    done: false,
    notified2: false,
    notified1: false,
    createdAt: Date.now()
  },
  {
    id: 's2',
    name: 'Согласовать бюджет на Q3 2026',
    desc: 'Направить финальную версию бюджета на согласование CFO и зафиксировать правки.',
    deadline: offsetDate(2),
    status: 'review',
    priority: 'high',
    done: false,
    notified2: false,
    notified1: false,
    createdAt: Date.now() - 1e6
  },
  {
    id: 's3',
    name: 'Провести onboarding для 3 новых сотрудников',
    desc: 'Подготовить welcome-пакет, провести вводный брифинг, выдать доступы к системам.',
    deadline: offsetDate(5),
    status: 'todo',
    priority: 'medium',
    done: false,
    notified2: false,
    notified1: false,
    createdAt: Date.now() - 2e6
  },
  {
    id: 's4',
    name: 'Аудит складских запасов (Алматы)',
    desc: 'Сверить фактические остатки с данными в ERP-системе, устранить расхождения.',
    deadline: offsetDate(10),
    status: 'todo',
    priority: 'medium',
    done: false,
    notified2: false,
    notified1: false,
    createdAt: Date.now() - 3e6
  },
  {
    id: 's5',
    name: 'Обновить регламент закупок',
    desc: 'Внести изменения согласно новым требованиям тендерного законодательства РК.',
    deadline: offsetDate(14),
    status: 'done',
    priority: 'low',
    done: true,
    notified2: true,
    notified1: true,
    createdAt: Date.now() - 5e6
  }
];

function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// ─── STORAGE ──────────────────────────────────────────────────────────────────
function load() {
  const raw = localStorage.getItem('op_tasks_v2');
  if (raw) {
    tasks = JSON.parse(raw);
  } else {
    tasks = SEED.map(t => ({...t}));
    save();
  }
}
function save() {
  localStorage.setItem('op_tasks_v2', JSON.stringify(tasks));
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function daysUntil(dateStr) {
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - now) / 864e5);
}

function formatDate(dateStr) {
  const [y,m,d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

function urgencyScore(task) {
  if (task.done) return 9999;
  return daysUntil(task.deadline);
}

function getCardClass(task) {
  if (task.done) return 'done-card';
  const d = daysUntil(task.deadline);
  if (d < 0) return 'overdue';
  if (d === 0 || d === 1) return 'urgent';
  if (d === 2) return 'warning';
  return 'normal';
}

function getDaysBadge(task) {
  if (task.done) return `<span class="days-badge days-done">Выполнено</span>`;
  const d = daysUntil(task.deadline);
  if (d < 0) return `<span class="days-badge days-overdue">Просрочено на ${Math.abs(d)} д.</span>`;
  if (d === 0) return `<span class="days-badge days-urgent">Сегодня!</span>`;
  if (d === 1) return `<span class="days-badge days-urgent">Завтра!</span>`;
  if (d <= 2) return `<span class="days-badge days-warning">Осталось ${d} дня</span>`;
  return `<span class="days-badge days-ok">Осталось ${d} дней</span>`;
}

function getStatusBadge(status) {
  return `<span class="badge badge-status-${status}">${STATUSES[status] || status}</span>`;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderTasks() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = tasks.filter(t => {
    if (currentFilter !== 'all' && t.status !== currentFilter) return false;
    if (search && !t.name.toLowerCase().includes(search)) return false;
    return true;
  });

  filtered.sort((a, b) => urgencyScore(a) - urgencyScore(b));

  document.getElementById('tasks-count-label').textContent =
    `Задачи (${filtered.length})`;

  const list = document.getElementById('taskList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="icon">📭</div>
      <p>Задач не найдено. Добавьте первую задачу!</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(t => `
    <div class="task-card ${getCardClass(t)}" id="card-${t.id}">
      <div class="task-checkbox ${t.done ? 'checked' : ''}" onclick="toggleDone('${t.id}')"></div>
      <div class="task-body">
        <div class="task-name">${escHtml(t.name)}</div>
        ${t.desc ? `<div style="font-size:13px;color:var(--muted);margin-top:5px">${escHtml(t.desc)}</div>` : ''}
        <div class="task-meta">
          ${getStatusBadge(t.status)}
          ${getDaysBadge(t)}
          <span class="deadline-text">📅 ${formatDate(t.deadline)}</span>
          <span class="deadline-text">${t.priority === 'high' ? '🔴' : t.priority === 'medium' ? '🟡' : '🟢'} ${PRIORITIES[t.priority]}</span>
        </div>
      </div>
      <div class="task-actions">
        <button class="btn btn-ghost btn-sm" onclick="editTask('${t.id}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">🗑</button>
      </div>
    </div>
  `).join('');

  updateStats();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateStats() {
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const inprog = tasks.filter(t => t.status === 'in_progress').length;
  const urgent = tasks.filter(t => !t.done && daysUntil(t.deadline) <= 2).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-inprog').textContent = inprog;
  document.getElementById('stat-urgent').textContent = urgent;

  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

// ─── FILTER ──────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openModal(id) {
  editingId = id || null;
  const modal = document.getElementById('taskModal');
  document.getElementById('modalTitle').textContent = id ? 'Редактировать задачу' : 'Новая задача';

  if (id) {
    const t = tasks.find(x => x.id === id);
    document.getElementById('f-name').value = t.name;
    document.getElementById('f-desc').value = t.desc || '';
    document.getElementById('f-deadline').value = t.deadline;
    document.getElementById('f-status').value = t.status;
    document.getElementById('f-priority').value = t.priority;
  } else {
    document.getElementById('f-name').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-deadline').value = offsetDate(7);
    document.getElementById('f-status').value = 'todo';
    document.getElementById('f-priority').value = 'medium';
  }
  modal.classList.add('show');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeModal() {
  document.getElementById('taskModal').classList.remove('show');
  editingId = null;
}

function saveTask() {
  const name = document.getElementById('f-name').value.trim();
  const deadline = document.getElementById('f-deadline').value;
  if (!name) { showToast('Введите название задачи', 'error'); return; }
  if (!deadline) { showToast('Выберите дедлайн', 'error'); return; }

  if (editingId) {
    const t = tasks.find(x => x.id === editingId);
    t.name = name;
    t.desc = document.getElementById('f-desc').value.trim();
    t.deadline = deadline;
    t.status = document.getElementById('f-status').value;
    t.priority = document.getElementById('f-priority').value;
    if (t.status === 'done') t.done = true;
    showToast('Задача обновлена', 'success');
  } else {
    tasks.push({
      id: 't' + Date.now(),
      name,
      desc: document.getElementById('f-desc').value.trim(),
      deadline,
      status: document.getElementById('f-status').value,
      priority: document.getElementById('f-priority').value,
      done: document.getElementById('f-status').value === 'done',
      notified2: false,
      notified1: false,
      createdAt: Date.now()
    });
    showToast('Задача добавлена', 'success');
  }

  save();
  closeModal();
  renderTasks();
}

// ─── TASK ACTIONS ─────────────────────────────────────────────────────────────
function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  t.done = !t.done;
  t.status = t.done ? 'done' : 'todo';
  save();
  renderTasks();
  showToast(t.done ? '✅ Задача выполнена!' : 'Задача возвращена в работу', t.done ? 'success' : 'warning');
}

function editTask(id) { openModal(id); }

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  save();
  renderTasks();
  showToast('Задача удалена', 'error');
}

// ─── NOTIFICATIONS ────────────────────────────────────────────────────────────
function checkNotifications() {
  const urgent = [];
  tasks.forEach(t => {
    if (t.done) return;
    const d = daysUntil(t.deadline);
    if (d === 1 && !t.notified1) {
      urgent.push({ task: t, days: 1 });
      t.notified1 = true;
      sendBrowserNotif(`⚠️ Завтра дедлайн: ${t.name}`, `Осталось 1 день. Дедлайн: ${formatDate(t.deadline)}`);
    } else if (d === 2 && !t.notified2) {
      urgent.push({ task: t, days: 2 });
      t.notified2 = true;
      sendBrowserNotif(`📅 Через 2 дня дедлайн: ${t.name}`, `Дедлайн: ${formatDate(t.deadline)}`);
    }
  });

  if (urgent.length > 0) {
    save();
    const banner = document.getElementById('notifBanner');
    const list = document.getElementById('notifList');
    list.innerHTML = urgent.map(u =>
      `<div class="notif-item">• <b>${escHtml(u.task.name)}</b> — через ${u.days} ${u.days === 1 ? 'день' : 'дня'} (${formatDate(u.task.deadline)}) · Уведомление отправлено на ${USER_EMAIL}</div>`
    ).join('');
    banner.classList.add('show');
  }

  // also show overdue
  const overdue = tasks.filter(t => !t.done && daysUntil(t.deadline) < 0);
  if (overdue.length > 0) {
    const banner = document.getElementById('notifBanner');
    const list = document.getElementById('notifList');
    const existing = list.innerHTML;
    list.innerHTML = existing + overdue.map(t =>
      `<div class="notif-item" style="color:#ff8080">• <b>${escHtml(t.name)}</b> — просрочено на ${Math.abs(daysUntil(t.deadline))} дн. (дедлайн был ${formatDate(t.deadline)})</div>`
    ).join('');
    banner.classList.add('show');
  }
}

function sendBrowserNotif(title, body) {
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon: '📋' });
  }
}

function requestNotifPermission() {
  if (!('Notification' in window)) {
    showToast('Браузер не поддерживает уведомления', 'error');
    return;
  }
  Notification.requestPermission().then(p => {
    if (p === 'granted') showToast('🔔 Уведомления включены', 'success');
    else showToast('Уведомления заблокированы', 'warning');
  });
}

// ─── RESET ───────────────────────────────────────────────────────────────────
function showResetConfirm() { document.getElementById('confirmModal').classList.add('show'); }
function closeConfirm() { document.getElementById('confirmModal').classList.remove('show'); }
function resetAll() {
  tasks = [];
  save();
  closeConfirm();
  renderTasks();
  document.getElementById('notifBanner').classList.remove('show');
  showToast('Все данные удалены', 'error');
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg, type = '') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ─── CLOSE MODALS ON OVERLAY CLICK ───────────────────────────────────────────
document.getElementById('taskModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.getElementById('confirmModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeConfirm();
});

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(); }
  if (e.key === 'Enter' && document.getElementById('taskModal').classList.contains('show')) {
    if (document.activeElement.tagName !== 'TEXTAREA') saveTask();
  }
});

// ─── DATE DISPLAY ─────────────────────────────────────────────────────────────
function setTodayDate() {
  const d = new Date();
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  document.getElementById('today-date').textContent =
    `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
setTodayDate();
renderTasks();
checkNotifications();

// Re-check every hour
setInterval(() => {
  checkNotifications();
  renderTasks();
}, 3600000);
</script>
</body>
